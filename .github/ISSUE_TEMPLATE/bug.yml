name: Bug
description: Something in the game is broken.
labels: ["type:bug"]
body:
  - type: dropdown
    id: severity
    attributes:
      label: Severity
      description: Add the matching `severity:*` label after creating.
      options:
        - critical — data loss, purchases broken, unplayable, exploit
        - major — feature broken, no workaround
        - minor — everything else
    validations:
      required: true
  - type: dropdown
    id: environment
    attributes:
      label: Environment
      options:
        - Dev
        - Staging
        - Production
    validations:
      required: true
  - type: input
    id: device
    attributes:
      label: Device and platform
      placeholder: "e.g. Samsung A12, Android / Windows PC"
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      value: "1. "
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: Developer Console (F9), server and client.
      render: text
  - type: input
    id: versions
    attributes:
      label: Game Version
      description: Shown in the corner of the screen, e.g. v1.5.0-rc.2. Add the Source Place version if known.
      placeholder: v1.5.0-rc.2
